[LL_WEBREPORT_EXCLUDEHTML /]

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MSA Pricing - Unprocessed Documents Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.min.js"></script>
</head>

<body>

    <div id="total-source-rows">
        [LL_REPTAG_TOTALSOURCEROWS /]
    </div>

    <div id="run-controls">
        <label>
            Resume Page
            <input id="resume-page" type="number" min="1" value="1">
        </label>

        <label>
            Max Retries
            <input id="max-retries" type="number" min="0" value="2">
        </label>

        <label>
            Batch Size
            <input id="batch-size" type="number" min="1" value="5">
        </label>

        <button id="start-btn" type="button">Start</button>
        <button id="stop-btn" type="button" disabled>Stop</button>
    </div>

    <div id="run-status"></div>
    <pre id="run-summary"></pre>

  
<script>
    (function () {
        var PAGE_SIZE = 300;
        var REPORT_ID = 35955741;
        var DEFAULT_START_PAGE = 1;
        var DEFAULT_MAX_RETRIES = 2;
        var DEFAULT_BATCH_SIZE = 5;
        var EXTRA_PAGE_BUFFER = 1;

        var statusEl = document.getElementById("run-status");
        var summaryEl = document.getElementById("run-summary");
        var totalEl = document.getElementById("total-source-rows");
        var startBtn = document.getElementById("start-btn");
        var stopBtn = document.getElementById("stop-btn");
        var resumePageEl = document.getElementById("resume-page");
        var maxRetriesEl = document.getElementById("max-retries");
        var batchSizeEl = document.getElementById("batch-size");
        var totalRows = parseInt((totalEl && totalEl.textContent || "").trim(), 10);
        var isRunning = false;
        var stopRequested = false;
        var activeCancelSources = [];
        var stopResumePageHint = null;

        function setStatus(message) {
            if (statusEl) {
                statusEl.textContent = message;
            }
        }

        function setSummary(message) {
            if (summaryEl) {
                summaryEl.textContent = message;
            }
        }

        function updateControls(running) {
            if (startBtn) {
                startBtn.disabled = running;
            }
            if (stopBtn) {
                stopBtn.disabled = !running;
            }
            if (resumePageEl) {
                resumePageEl.disabled = running;
            }
            if (maxRetriesEl) {
                maxRetriesEl.disabled = running;
            }
            if (batchSizeEl) {
                batchSizeEl.disabled = running;
            }
        }

        function getConfig() {
            var startPage = parseInt(resumePageEl ? resumePageEl.value : String(DEFAULT_START_PAGE), 10);
            var maxRetries = parseInt(maxRetriesEl ? maxRetriesEl.value : String(DEFAULT_MAX_RETRIES), 10);
            var batchSize = parseInt(batchSizeEl ? batchSizeEl.value : String(DEFAULT_BATCH_SIZE), 10);

            startPage = Number.isFinite(startPage) && startPage > 0 ? startPage : DEFAULT_START_PAGE;
            maxRetries = Number.isFinite(maxRetries) && maxRetries >= 0 ? maxRetries : DEFAULT_MAX_RETRIES;
            batchSize = Number.isFinite(batchSize) && batchSize > 0 ? batchSize : DEFAULT_BATCH_SIZE;

            if (resumePageEl) {
                resumePageEl.value = String(startPage);
            }
            if (maxRetriesEl) {
                maxRetriesEl.value = String(maxRetries);
            }
            if (batchSizeEl) {
                batchSizeEl.value = String(batchSize);
            }

            return {
                startPage: startPage,
                maxRetries: maxRetries,
                batchSize: batchSize
            };
        }

        function addCancelSource(page, source) {
            activeCancelSources.push({ page: page, source: source });
        }

        function removeCancelSource(source) {
            activeCancelSources = activeCancelSources.filter(function (item) {
                return item.source !== source;
            });
        }

        function runPagedReport(config, done) {
            if (!Number.isFinite(totalRows) || totalRows <= 0) {
                setStatus("No rows to process.");
                done();
                return;
            }

            var baseTotalPages = Math.ceil(totalRows / PAGE_SIZE);
            var totalPages = baseTotalPages + EXTRA_PAGE_BUFFER;
            var failures = [];
            var processedPages = 0;
            var effectiveStartPage = Math.min(config.startPage, totalPages);
            var nextPage = effectiveStartPage;
            var inFlight = 0;

            if (config.startPage > totalPages) {
                setStatus("resumePage is greater than total pages. Nothing to run.");
                setSummary("totalPages=" + totalPages + " | requested resumePage=" + config.startPage);
                done();
                return;
            }

            setStatus("Starting run: " + totalRows + " rows across " + totalPages + " page(s) including " + EXTRA_PAGE_BUFFER + " extra safety page(s). Running from page " + effectiveStartPage + " with batch size " + config.batchSize + ".");
            setSummary("config: pageSize=" + PAGE_SIZE + ", maxRetries=" + config.maxRetries + ", resumePage=" + effectiveStartPage + ", batchSize=" + config.batchSize + ", baseTotalPages=" + baseTotalPages + ", extraPageBuffer=" + EXTRA_PAGE_BUFFER + ", effectiveTotalPages=" + totalPages);

            function finalizeIfComplete() {
                if (stopRequested) {
                    if (inFlight > 0) {
                        return;
                    }
                    var resumePage = stopResumePageHint || nextPage;
                    if (resumePage > totalPages) {
                        resumePage = totalPages;
                    }
                    setStatus("Stopped by user. Successful pages: " + processedPages + ".");
                    setSummary("resume from: " + resumePage + "\nprocessedPages=" + processedPages + "\nfailuresSoFar=" + JSON.stringify(failures));
                    done();
                    return;
                }

                if (nextPage <= totalPages || inFlight > 0) {
                    return;
                }

                if (failures.length > 0) {
                    var failedPages = failures.map(function (f) { return f.page; });
                    var nextResumePage = failedPages[0];
                    setStatus("Completed with " + failures.length + " failed page(s). Successful pages: " + processedPages + ".");
                    setSummary(
                        "failedPages=" + failedPages.join(",") + "\n" +
                        "resumeFromFirstFailed=" + nextResumePage + "\n" +
                        "details=" + JSON.stringify(failures)
                    );
                } else {
                    setStatus("Completed successfully. Processed " + totalRows + " rows across " + totalPages + " page(s) from page " + effectiveStartPage + ".");
                    setSummary("No failures.");
                }
                done();
            }

            function runPageWithRetry(page, onComplete) {
                var startAt = ((page - 1) * PAGE_SIZE) + 1;
                var url = window.location.origin + "/otcs/cs.exe?func=ll&objId=" + REPORT_ID + "&objAction=RunReport&page=" + page + "&startAt=" + startAt;

                function attemptRequest(attempt) {
                    if (stopRequested) {
                        onComplete({ stopped: true });
                        return;
                    }

                    if (attempt > 0) {
                        setStatus("Retry " + attempt + " for page " + page + " of " + totalPages + "...");
                    }

                    if (typeof axios === "undefined") {
                        setStatus("Axios is not loaded.");
                        setSummary("Unable to continue because axios library is unavailable.");
                        onComplete({ blocked: true });
                        return;
                    }

                    var requestSettled = false;
                    var cancelSource = axios.CancelToken.source();
                    addCancelSource(page, cancelSource);

                    axios({
                        method: "get",
                        url: url,
                        withCredentials: true,
                        responseType: "text",
                        headers: {
                            "Accept": "text/html"
                        },
                        cancelToken: cancelSource.token
                    }).then(function (response) {
                        if (requestSettled) {
                            return;
                        }
                        requestSettled = true;
                        removeCancelSource(cancelSource);

                        var status = response && response.status;

                        if (status >= 200 && status < 300) {
                            onComplete({ ok: true });
                            return;
                        }

                        if (attempt < config.maxRetries) {
                            attemptRequest(attempt + 1);
                            return;
                        }

                        onComplete({ ok: false, failure: { page: page, startAt: startAt, status: status || "network-error" } });
                    }).catch(function (error) {
                        if (requestSettled) {
                            return;
                        }
                        requestSettled = true;
                        removeCancelSource(cancelSource);

                        if (axios.isCancel && axios.isCancel(error)) {
                            onComplete({ stopped: true });
                            return;
                        }

                        if (attempt < config.maxRetries) {
                            attemptRequest(attempt + 1);
                            return;
                        }

                        onComplete({ ok: false, failure: { page: page, startAt: startAt, status: "network-error" } });
                    });
                }

                setStatus("Running page " + page + " of " + totalPages + " (startAt=" + startAt + ")...");
                attemptRequest(0);
            }

            function launchNext() {
                while (!stopRequested && inFlight < config.batchSize && nextPage <= totalPages) {
                    var page = nextPage;
                    nextPage += 1;
                    inFlight += 1;

                    runPageWithRetry(page, function (result) {
                        inFlight -= 1;

                        if (result && result.blocked) {
                            stopRequested = true;
                        } else if (result && result.ok) {
                            processedPages += 1;
                        } else if (result && result.failure) {
                            failures.push(result.failure);
                        }

                        launchNext();
                        finalizeIfComplete();
                    });
                }

                finalizeIfComplete();
            }

            launchNext();
        }

        function startRun() {
            if (isRunning) {
                return;
            }

            isRunning = true;
            stopRequested = false;
            updateControls(true);

            runPagedReport(getConfig(), function () {
                isRunning = false;
                stopRequested = false;
                activeCancelSources = [];
                stopResumePageHint = null;
                updateControls(false);
            });
        }

        function stopRun() {
            if (!isRunning) {
                return;
            }
            stopRequested = true;
            stopResumePageHint = activeCancelSources.length > 0
                ? Math.min.apply(null, activeCancelSources.map(function (item) { return item.page; }).concat([stopResumePageHint || Infinity]))
                : (stopResumePageHint || Infinity);
            if (!Number.isFinite(stopResumePageHint) || stopResumePageHint === Infinity) {
                stopResumePageHint = null;
            }

            activeCancelSources.forEach(function (item) {
                item.source.cancel("User stopped run");
            });
            activeCancelSources = [];
            if (stopResumePageHint === null && resumePageEl) {
                stopResumePageHint = parseInt(resumePageEl.value, 10) || DEFAULT_START_PAGE;
            }
        }

        if (startBtn) {
            startBtn.addEventListener("click", startRun);
        }
        if (stopBtn) {
            stopBtn.addEventListener("click", stopRun);
        }

        setStatus("Ready. Configure values and click Start.");
        setSummary("Default config: pageSize=" + PAGE_SIZE + ", maxRetries=" + DEFAULT_MAX_RETRIES + ", resumePage=" + DEFAULT_START_PAGE + ", batchSize=" + DEFAULT_BATCH_SIZE);
    })();

</script>

</body>

</html>
