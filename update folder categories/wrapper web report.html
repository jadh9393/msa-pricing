[LL_WEBREPORT_EXCLUDEHTML /]

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MSA Pricing - Set MSA Pricing categories</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.min.js"></script>
</head>

<body>
    <h2>MSA Pricing - Set MSA Pricing categories</h2>
    <div id="total-source-rows">
        Total Nodes: [LL_REPTAG_TOTALSOURCEROWS /]
    </div>

    <div id="run-controls">
        <label>
            Resume Page
            <input id="resume-page" type="number" min="1" value="1">
        </label>

        <label>
            Max Retries
            <input id="max-retries" type="number" min="0" value="2">
        </label>

        <button id="start-btn" type="button">Start</button>
        <button id="stop-btn" type="button" disabled>Stop</button>
    </div>

    <div id="run-status"></div>
    <pre id="run-summary"></pre>

  
<script>
    (function () {
        var PAGE_SIZE = 300;
        var REPORT_ID = 35951189;
        var DEFAULT_START_PAGE = 1;
        var DEFAULT_MAX_RETRIES = 2;

        var statusEl = document.getElementById("run-status");
        var summaryEl = document.getElementById("run-summary");
        var totalEl = document.getElementById("total-source-rows");
        var startBtn = document.getElementById("start-btn");
        var stopBtn = document.getElementById("stop-btn");
        var resumePageEl = document.getElementById("resume-page");
        var maxRetriesEl = document.getElementById("max-retries");
        var totalRows = parseInt((totalEl && totalEl.textContent || "").trim(), 10);
        var isRunning = false;
        var stopRequested = false;
        var activeCancelSource = null;

        function setStatus(message) {
            if (statusEl) {
                statusEl.textContent = message;
            }
        }

        function setSummary(message) {
            if (summaryEl) {
                summaryEl.textContent = message;
            }
        }

        function updateControls(running) {
            if (startBtn) {
                startBtn.disabled = running;
            }
            if (stopBtn) {
                stopBtn.disabled = !running;
            }
            if (resumePageEl) {
                resumePageEl.disabled = running;
            }
            if (maxRetriesEl) {
                maxRetriesEl.disabled = running;
            }
        }

        function getConfig() {
            var startPage = parseInt(resumePageEl ? resumePageEl.value : String(DEFAULT_START_PAGE), 10);
            var maxRetries = parseInt(maxRetriesEl ? maxRetriesEl.value : String(DEFAULT_MAX_RETRIES), 10);

            startPage = Number.isFinite(startPage) && startPage > 0 ? startPage : DEFAULT_START_PAGE;
            maxRetries = Number.isFinite(maxRetries) && maxRetries >= 0 ? maxRetries : DEFAULT_MAX_RETRIES;

            if (resumePageEl) {
                resumePageEl.value = String(startPage);
            }
            if (maxRetriesEl) {
                maxRetriesEl.value = String(maxRetries);
            }

            return {
                startPage: startPage,
                maxRetries: maxRetries
            };
        }

        function runPagedReport(config, done) {
            if (!Number.isFinite(totalRows) || totalRows <= 0) {
                setStatus("No rows to process.");
                done();
                return;
            }

            var totalPages = Math.ceil(totalRows / PAGE_SIZE);
            var failures = [];
            var processedPages = 0;
            var effectiveStartPage = Math.min(config.startPage, totalPages);

            if (config.startPage > totalPages) {
                setStatus("resumePage is greater than total pages. Nothing to run.");
                setSummary("totalPages=" + totalPages + " | requested resumePage=" + config.startPage);
                done();
                return;
            }

            setStatus("Starting run: " + totalRows + " rows across " + totalPages + " page(s). Running from page " + effectiveStartPage + ".");
            setSummary("config: pageSize=" + PAGE_SIZE + ", maxRetries=" + config.maxRetries + ", resumePage=" + effectiveStartPage);

            function processPage(page) {
                if (page > totalPages) {
                    if (failures.length > 0) {
                        var failedPages = failures.map(function (f) { return f.page; });
                        var nextResumePage = failedPages[0];
                        setStatus("Completed with " + failures.length + " failed page(s). Successful pages: " + processedPages + ".");
                        setSummary(
                            "failedPages=" + failedPages.join(",") + "\n" +
                            "resumeFromFirstFailed=" + nextResumePage + "\n" +
                            "details=" + JSON.stringify(failures)
                        );
                    } else {
                        setStatus("Completed successfully. Processed " + totalRows + " rows across " + totalPages + " page(s) from page " + effectiveStartPage + ".");
                        setSummary("No failures.");
                    }
                    done();
                    return;
                }

                if (stopRequested) {
                    setStatus("Stopped by user at page " + page + " of " + totalPages + ".");
                    setSummary("resume from: " + page + "\nprocessedPages=" + processedPages + "\nfailuresSoFar=" + JSON.stringify(failures));
                    done();
                    return;
                }

                var startAt = ((page - 1) * PAGE_SIZE) + 1;
                var url = window.location.origin + "/otcs/cs.exe?func=ll&objId=" + REPORT_ID + "&objAction=RunReport&page=" + page + "&startAt=" + startAt;
                setStatus("Running page " + page + " of " + totalPages + " (startAt=" + startAt + ")...");

                function attemptRequest(attempt) {
                    if (stopRequested) {
                        setStatus("Stopping requested. Ending run...");
                        setSummary("resume from: " + page + "\nprocessedPages=" + processedPages + "\nfailuresSoFar=" + JSON.stringify(failures));
                        done();
                        return;
                    }

                    if (attempt > 0) {
                        setStatus("Retry " + attempt + " for page " + page + " of " + totalPages + "...");
                    }

                    if (typeof axios === "undefined") {
                        setStatus("Axios is not loaded.");
                        setSummary("Unable to continue because axios library is unavailable.");
                        done();
                        return;
                    }

                    var requestSettled = false;
                    activeCancelSource = axios.CancelToken.source();

                    axios({
                        method: "get",
                        url: url,
                        withCredentials: true,
                        responseType: "text",
                        headers: {
                            "Accept": "text/html"
                        },
                        cancelToken: activeCancelSource.token
                    }).then(function (response) {
                        if (requestSettled) {
                            return;
                        }
                        requestSettled = true;
                        activeCancelSource = null;

                        var status = response && response.status;

                        if (status >= 200 && status < 300) {
                            processedPages += 1;
                            processPage(page + 1);
                            return;
                        }

                        if (attempt < config.maxRetries) {
                            attemptRequest(attempt + 1);
                            return;
                        }

                        failures.push({ page: page, startAt: startAt, status: status || "network-error" });
                        processPage(page + 1);
                    }).catch(function (error) {
                        if (requestSettled) {
                            return;
                        }
                        requestSettled = true;
                        activeCancelSource = null;

                        if (axios.isCancel && axios.isCancel(error)) {
                            setStatus("Stopped by user during request execution.");
                            setSummary("resume from: " + page + "\nprocessedPages=" + processedPages + "\nfailuresSoFar=" + JSON.stringify(failures));
                            done();
                            return;
                        }

                        if (attempt < config.maxRetries) {
                            attemptRequest(attempt + 1);
                            return;
                        }

                        failures.push({ page: page, startAt: startAt, status: "network-error" });
                        processPage(page + 1);
                    });
                }

                attemptRequest(0);
            }

            processPage(effectiveStartPage);
        }

        function startRun() {
            if (isRunning) {
                return;
            }

            isRunning = true;
            stopRequested = false;
            updateControls(true);

            runPagedReport(getConfig(), function () {
                isRunning = false;
                stopRequested = false;
                activeCancelSource = null;
                updateControls(false);
            });
        }

        function stopRun() {
            if (!isRunning) {
                return;
            }
            stopRequested = true;
            if (activeCancelSource) {
                activeCancelSource.cancel("User stopped run");
            }
        }

        if (startBtn) {
            startBtn.addEventListener("click", startRun);
        }
        if (stopBtn) {
            stopBtn.addEventListener("click", stopRun);
        }

        setStatus("Ready. Configure values and click Start.");
        setSummary("Default config: pageSize=" + PAGE_SIZE + ", maxRetries=" + DEFAULT_MAX_RETRIES + ", resumePage=" + DEFAULT_START_PAGE);
    })();

</script>

</body>

</html>
